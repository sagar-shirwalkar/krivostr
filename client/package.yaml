name: krivostr-client
version: 0.2.0.0
github: yourhandle/krivostr
license: MIT
author: you
maintainer: you@example.com
category: Network

dependencies:
  - base >= 4.19 && < 5
  - krivostr-core
  - aeson
  - text
  - bytestring
  - containers
  - stm
  - async
  - wuss
  - websockets
  - monad-logger
  - warp
  - wai
  - wai-websockets
  - wai-app-static
  - http-types
  - sqlite-simple
  - direct-sqlite
  - time
  - filepath
  - directory
  - mtl

executables:
  krivostr-client:
    main: Main.hs
    source-dirs: src
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -Wall

tests:
  spec:
    type: exitcode-stdio-1.0
    main: Spec.hs
    source-dirs: test
    dependencies:
      - krivostr-client
      - krivostr-core
      - hspec
      - QuickCheck
      - temporary
      - stm
    ghc-options: [-threaded]
