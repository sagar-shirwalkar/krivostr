name: krivostr-client
version: 0.2.0.0
github: sagar-shirwalkar/krivostr
license: AGPL-3.0-only
author: you
maintainer: you@example.com
category: Network

dependencies:
  - base >= 4.19 && < 5
  - krivostr-core
  - aeson
  - text
  - bytestring
  - containers
  - stm
  - async
  - wuss
  - websockets
  - network
  - monad-logger
  - warp
  - wai
  # warp re-exports the HostPreference type but not its constructors, which
  # live in streaming-commons.
  - streaming-commons
  - wai-websockets
  - wai-app-static
  - http-types
  - sqlite-simple
  - direct-sqlite
  - time
  - filepath
  - directory
  - mtl
  - optparse-applicative
  - crypton
  - base64-bytestring
  - base16-bytestring
  - process

executables:
  krivostr:
    main: Main.hs
    # app/ holds the entry point, src/ the modules. The test suite below
    # compiles src/ directly (there is no library component), and test/Spec.hs
    # is also module Main -- so an entry point inside src/ would put two `Main`
    # modules on the test suite's search path.
    source-dirs: [app, src]
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -Wall

tests:
  spec:
    main: Spec.hs
    # There is no library component, so the client modules are compiled into the
    # test suite directly. Depending on `krivostr-client` here failed configure
    # with "missing or private dependencies" because only an exe is exposed.
    source-dirs: [test, src]
    dependencies:
      - krivostr-core
      - hspec
      - QuickCheck
      - temporary
      - stm
    ghc-options: [-threaded]
