# ─── OSV Scanner: pull request diff ────────────────────────────────────
#
# Compares a vulnerability scan of the target branch against the feature
# branch and fails only if the PR introduces new vulnerabilities. This is
# the check you gate merges on, because it cannot fail on a pre-existing
# issue the author did not cause.
#
# Why this exists when Dependabot does not: Dependabot has no Haskell
# ecosystem. It cannot see stack.yaml.lock at all. OSV Scanner reads
# stack.yaml.lock natively, along with ui/pnpm-lock.yaml, so it is the only
# tool in this repository that audits the Haskell dependency tree.
name: osv-pr

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

# Top-level permissions are read-only. The security-events: write scope
# belongs on the job that calls the reusable workflow, not on the whole
# workflow -- Scorecard's Token-Permissions check requires write scopes to
# be scoped to the job that uses them.
permissions:
  contents: read

jobs:
  scan-pr:
    # The reusable workflow uploads SARIF to the Security tab, which is why
    # this job declares security-events: write. Caller-granted permissions
    # are the ceiling the called workflow runs under, so the scope has to be
    # here even though the upload happens inside the reusable workflow.
    permissions:
      actions: read
      contents: read
      security-events: write
    # Pin to a full-length commit SHA before merging. See the note in
    # container-scan.yml for why: tag references are mutable, and the
    # 2026 Trivy compromise force-pushed tags to a backdoored commit.
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@375a0e8ebdc98e99b02ac4338a724f5750f21213"
