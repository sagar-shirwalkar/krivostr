# Deploy the UI to Cloudflare Pages.
#
# Setup, once, in the Cloudflare dashboard (Pages is the part that needs
# configuring; the token does not):
#
#   1. Workers & Pages -> Create -> Pages -> Upload assets (drag-and-drop
#      deploys are fine to discard; this creates the project).
#   2. Repository -> Settings -> Secrets and variables -> Actions -> New
#      repository variable:
#        VITE_BRIDGE_URL  = wss://your-bridge-host/ws
#      A Pages deployment is static, so it cannot reach a bridge on your
#      laptop, and this variable is how the page learns where the bridge is.
#      Vite inlines it at build time and this workflow builds the assets here
#      before uploading them, so it has to be a repository variable -- setting
#      it on the Pages project would only affect a Pages-side build, which this
#      workflow never does. Left unset, the UI assumes the bridge shares its own
#      origin, which is what `krivostr serve` gives you.
#   3. Repository -> Settings -> Secrets -> Actions -> New repository secret:
#        CLOUDFLARE_API_TOKEN  (Edit Cloudflare Workers, template)
#        CLOUDFLARE_ACCOUNT_ID (from the dashboard sidebar)
#
# Cloudflare Pages can also build this repository itself with no workflow at
# all: set the build command to "pnpm install --frozen-lockfile && pnpm build",
# the output directory to "dist", and the root directory to "ui". Use whichever
# fits; this workflow exists so the deploy is visible in the same history as
# the code that produced it.
name: ui

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  workflow_dispatch:

# Only one deployment at a time, and never cancel one halfway: a half-written
# deployment is worse than a slightly stale one.
concurrency:
  group: ui-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the browser tests
        working-directory: ui
        # After `pnpm install`, not before: `pnpm exec` resolves out of
        # node_modules, so installing the browser first fails with
        # ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL "Command playwright not found".
        # pnpm install fetches the driver, not the browser, hence this step;
        # the cache above keeps it cheap.
        run: pnpm exec playwright install --with-deps chromium chromium-headless-shell

      - name: Typecheck, test and build
        working-directory: ui
        env:
          # Unset is a valid deployment: the UI then looks for the bridge on
          # its own origin.
          VITE_BRIDGE_URL: ${{ vars.VITE_BRIDGE_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm test:browser
          pnpm build
          # Pages parses this file out of dist/ rather than serving it. If the
          # build stops copying public/, the deployment would go out with no
          # CSP and no cache headers and nothing else here would notice.
          test -f dist/_headers

      - name: Ensure Pages project exists
        # wrangler refuses to create a Pages project implicitly during a deploy
        # in a non-interactive shell: the local CLI prompts "create project?"
        # when it sees an unknown name, but there is no TTY in CI, so it fails
        # with "The Pages project does not exist." Creating it here first makes
        # the deploy below a plain upload.
        #
        # The `|| true` makes this idempotent: on the first run the project is
        # created, on every subsequent run wrangler exits non-zero with
        # "A project with this name already exists" and the `|| true` swallows
        # it. There is no `--if-not-exists` flag on `pages project create`.
        #
        # --production-branch=main matters only for the first run; it tells
        # Pages which branch is the production branch, so that subsequent
        # deploys from `main` update the live site rather than a preview URL.
        # Re-running this step later is a no-op and cannot change it.
        working-directory: ui
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages project create krivostr-ui --production-branch=main || true

      - name: Deploy
        # wrangler is a devDependency, so `pnpm install --frozen-lockfile` above
        # already put it on disk and this invokes that exact version.
        #
        # cloudflare/wrangler-action was installing wrangler at deploy time,
        # which fails here: with pnpm present the action's install step inherits
        # CI's frozen-lockfile default and cannot add a package the lockfile
        # does not mention (cloudflare/wrangler-action#338, #181), and its
        # package-manager detection breaks outside the repo root (#198). Calling
        # the local binary removes the guesswork and pins the version.
        #
        # `dist` is correct here only because working-directory is `ui`; wrangler
        # resolves it against the cwd, and from the repo root the build output is
        # `ui/dist`.
        working-directory: ui
        run: pnpm exec wrangler pages deploy dist --project-name=krivostr-ui --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
