<svg xmlns="http://www.w3.org/2000/svg" viewBox="-220 -220 440 440" role="img"
     aria-label="A Krivine machine: a control term above an environment stack of closures, with the push and apply steps of the reduction cycle drawn between them.">
  <title>krivostr — a Krivine machine</title>
  <desc>Call-by-name reduction as a control term c and an environment stack rho.
The control term is substituted into the stack (push), and the head of the stack
is applied to rebuild the next control term (apply).</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080810"/><stop offset="100%" stop-color="#141428"/>
    </linearGradient>

    <!-- cool plate: the dormant part of the environment -->
    <linearGradient id="plateFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3a63"/><stop offset="100%" stop-color="#0d1c33"/>
    </linearGradient>

    <!-- warm capsule: the term that is currently being reduced -->
    <linearGradient id="ctrlFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcc00"/><stop offset="100%" stop-color="#c66a10"/>
    </linearGradient>

    <!-- the head of the stack is lit: it is the next closure to be applied -->
    <linearGradient id="headFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a10"/><stop offset="100%" stop-color="#40280a"/>
    </linearGradient>

    <filter id="glowBig"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="glowSmall">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="glowTiny">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <marker id="arrowCool" viewBox="0 0 10 10" refX="5" refY="8"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,8 L0,10 z" fill="#88ccff"/>
    </marker>
    <marker id="arrowHot" viewBox="0 0 10 10" refX="5" refY="8"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,8 L0,10 z" fill="#ffcc00"/>
    </marker>
  </defs>

  <rect x="-220" y="-220" width="440" height="440" fill="url(#bgGrad)"/>

  <!-- ambient light: cool above (the waiting stack), warm below (the term) -->
  <ellipse cx="-70" cy="-120" rx="150" ry="110" fill="#4a8fe5" opacity="0.05" filter="url(#glowBig)"/>
  <ellipse cx="60" cy="60" rx="140" ry="100" fill="#ff4400" opacity="0.05" filter="url(#glowBig)"/>

  <!-- a cropped lambda in the corner, as texture rather than as diagram -->
  <text x="-218" y="-92" font-size="132" fill="#ffffff" opacity="0.035"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic">&#955;</text>

  <!-- ═══════════════ CONTROL TERM c ═══════════════ -->

  <text x="0" y="-186" text-anchor="middle" fill="#ffdd88" font-size="13"
        font-family="ui-monospace, 'JetBrains Mono', monospace"
        letter-spacing="2" opacity="0.8">control  c</text>

  <rect x="-125" y="-172" width="250" height="64" rx="14"
        fill="#ffcc00" opacity="0.18" filter="url(#glowSmall)"/>
  <rect x="-125" y="-172" width="250" height="64" rx="14"
        fill="url(#ctrlFill)" stroke="#ffd873" stroke-width="1"/>
  <text x="0" y="-131" text-anchor="middle" fill="#3a2400" font-size="23"
        font-family="ui-monospace, 'JetBrains Mono', monospace"
        font-weight="bold">(&#955;x. x y) z</text>

  <!-- ═══════════════ THE REDUCTION CYCLE ═══════════════ -->

  <!-- push: substitute the control term into the environment -->
  <path d="M -50,-100 C -92,-64 -92,-22 -74,0" fill="none" stroke="#88ccff"
        stroke-width="1.6" opacity="0.75" marker-end="url(#arrowCool)"/>
  <text x="-122" y="-52" text-anchor="middle" fill="#88ccff" font-size="13"
        font-family="ui-monospace, 'JetBrains Mono', monospace"
        letter-spacing="2" opacity="0.85">push</text>

  <!-- apply: pop the head of the stack into the next control term -->
  <path d="M 74,0 C 92,-22 92,-64 50,-100" fill="none" stroke="#ffcc00"
        stroke-width="1.6" opacity="0.8" marker-end="url(#arrowHot)"/>
  <text x="122" y="-52" text-anchor="middle" fill="#ffcc00" font-size="13"
        font-family="ui-monospace, 'JetBrains Mono', monospace"
        letter-spacing="2" opacity="0.85">apply</text>

  <!-- ═══════════════ ENVIRONMENT STACK rho ═══════════════ -->

  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="15"
     text-anchor="middle">

    <!-- a closure on its way down onto the stack -->
    <circle r="3" fill="#ffee66" filter="url(#glowTiny)">
      <animateMotion dur="3.2s" repeatCount="indefinite"
        path="M 0,-100 C -40,-70 -62,-24 -74,0"/>
      <animate attributeName="opacity" values="0;0.95;0.95;0" dur="3.2s"
        repeatCount="indefinite"/>
    </circle>
    <!-- and the head travelling back up as the new control term -->
    <circle r="3" fill="#88ccff" filter="url(#glowTiny)">
      <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite"
        path="M -74,0 C -62,-24 -40,-70 0,-100"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="3.2s"
        begin="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- the slot a pushed closure is heading for -->
    <rect x="-125" y="132" width="250" height="26" rx="9" fill="none"
          stroke="#4a8fe5" stroke-width="0.8" stroke-dasharray="3 4" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="3.2s"
        repeatCount="indefinite"/>
    </rect>

    <!-- plate 1: the head, lit -->
    <rect x="-125" y="4" width="250" height="26" rx="9" fill="none"
          stroke="#ffcc00" stroke-width="3" opacity="0.4" filter="url(#glowSmall)"/>
    <rect x="-125" y="4" width="250" height="26" rx="9"
          fill="url(#headFill)" stroke="#ffcc00" stroke-width="1"/>
    <text x="0" y="22" fill="#ffee66">&#10216;&#955;y. y, &#961;&#10217;</text>

    <!-- plates below: dormant closures -->
    <rect x="-125" y="36" width="250" height="26" rx="9"
          fill="url(#plateFill)" stroke="#5a9be5" stroke-width="0.8"/>
    <text x="0" y="54" fill="#cfe8ff">x &#8614; &#10216;&#955;*. y, &#961;&#10217;</text>

    <rect x="-125" y="68" width="250" height="26" rx="9"
          fill="url(#plateFill)" stroke="#5a9be5" stroke-width="0.8" opacity="0.85"/>
    <text x="0" y="86" fill="#cfe8ff" opacity="0.85">&#10216;&#955;z. z x, &#961;&#10217;</text>

    <rect x="-125" y="100" width="250" height="26" rx="9"
          fill="url(#plateFill)" stroke="#5a9be5" stroke-width="0.8" opacity="0.6"/>
    <text x="0" y="118" fill="#cfe8ff" opacity="0.6">&#961;&#8320;</text>
  </g>

  <!-- a marker on the left naming the head of the stack -->
  <polygon points="-138,17 -130,10 -130,24" fill="#ffcc00" opacity="0.9">
    <animate attributeName="opacity" values="0.35;0.95;0.35" dur="3.2s"
      repeatCount="indefinite"/>
  </polygon>

  <text x="0" y="182" text-anchor="middle" fill="#88ccff" font-size="13"
        font-family="ui-monospace, 'JetBrains Mono', monospace"
        letter-spacing="2" opacity="0.8">environment  &#961;</text>

  <!-- ═══════════════ WORDMARK ═══════════════ -->
  <text x="0" y="204" text-anchor="middle"
        fill="#ff8800" font-size="14"
        font-family="ui-monospace, 'JetBrains Mono', monospace"
        font-weight="bold" opacity="0.35" letter-spacing="10">K R I V O S T R</text>
</svg>
