# Stack owns the package set: everything below resolves from LTS-24 with no
# extra-deps, so `stack build` is reproducible from this file alone.
#
# GHC 9.14.1 was never usable here -- Stackage has not adopted it (the
# 2026-10-02 nightly is still on 9.12.x), so `resolver: ghc-9.14.1` resolved to
# an empty package set and could not even construct a build plan. LTS-24 pins
# GHC 9.10.3 and carries wuss-2.x, websockets-0.13, aeson, sqlite-simple and
# direct-sqlite already built and tested together.
#
# wuss 1.1.x cannot be used on any modern GHC regardless (base < 4.17,
# websockets < 0.13), which is why the old wuss-1.2.2 pin was unsatisfiable.
resolver: lts-24.61

packages:
  - core
  - client

# BIP-340 is implemented in pure Haskell (core/src/Krivostr/Schnorr.hs), so
# there is no libsecp256k1 system dependency anywhere in the build.